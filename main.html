<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-text">
            <h1>Personal Portfolio</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam lobortis sagittis dui, et porta purus.</p>
        </div>
        <div class="hero-image-container">
            <img src="https://via.placeholder.com/300" alt="Profile Photo" class="profile-img">
        </div>
    </section>

    <!-- Social Icons -->
    <div class="social-icons">
        <a href="#"><i class="icon-github"></i></a>
        <a href="#"><i class="icon-linkedin"></i></a>
        <a href="#"><i class="icon-instagram"></i></a>
    </div>

    <!-- About Section -->
    <section id="about", class="about-page-section">
        <h2 class="about-title">ABOUT ME</h2>

        <p class="about-content"></p>

        <a href="#" class="btn-download">
            DOWNLOAD CV
        </a>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="projects-section">
        <h2 class="section-title">RECENT PROJECTS</h2>
        <p class="section-desc">awawawawawawa</p>

        <div class="projects-grid">
            <div class="projects-card">
                <img src="https://usefulpix.com/ph/800x600/3B82F6" alt="Project 1">
                <h2>Project 1</h2>
            </div>

            <div class="projects-card">
                <img src="https://usefulpix.com/ph/800x600/3B82F6" alt="Project 2">
                <h2>Project 2</h2>
            </div>

            <div class="projects-card">
                <img src="https://usefulpix.com/ph/800x600/3B82F6" alt="Project 3">
                <h2>Project 3</h2>
            </div>
        </div>
    </section>

    <!-- Contacts Section -->
    <section class="contact-section">
        <h2>Contact Me</h2>
        <form class="contact-form">
            <div class="input-group">
                <input type="text" placeholder="Name">
            </div>
            <div class="input-group">
                <input type="email" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="tel" placeholder="Phone">
            </div>
            <div class="input-group">
                <textarea placeholder="Message"></textarea>
            </div>
            <button type="submit" class="btn-send">
                <span></span> SEND MESSAGE
            </button>
        </form>
    </section>

</body>
</html>
